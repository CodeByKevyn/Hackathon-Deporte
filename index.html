      <button class="btn btn-outline-light d-flex align-items-center ms-auto" type="button" data-bs-toggle="modal" data-bs-target="#modalCarrito">
        <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" class="bi bi-cart me-2" viewBox="0 0 16 16">

<!-- Modal del Carrito -->
<div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCarritoLabel">Tu Carrito de Compras</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Aquí puedes meter la lista de productos dinámicamente -->
        <p class="text-muted text-centermy-3">El carrito está vacío.</p>
      </div>
      <div class="modal-header d-flex justify-content-between">
        <strong>Total:</strong>
        <span>$0.00</span>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary">Proceder al pago</button>
      </div>
    </div>
  </div>
</div>
