<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Escudos</title>
    <link rel="stylesheet" href="style.css">
   
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
    <link rel="stylesheet" href="https://fonts.google.com/specimen/Bebas+Neue?utm_source=chatgpt.com&preview.script=Latn">
    <link rel="stylesheet" href="https://fonts.google.com/specimen/Bebas+Neue?utm_source=chatgpt.com&preview.script=Latn">

</head>
<body class="bg-light">

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Logo</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#">Equipo</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contactenos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Catalogo</a></li>
        </ul>
        
        <!-- Icono de Carrito SVG nativo -->
        <a href="#" class="text-white position-relative py-2 px-2 d-inline-block" 
           data-bs-toggle="offcanvas" 
           data-bs-target="#carritoOffcanvas" 
           aria-controls="carritoOffcanvas"
           style="text-decoration: none;">
          <svg xmlns="http://w3.org" width="24" height="24" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16">
            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
          </svg>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="contador-carrito" style="font-size: 0.65rem; padding: 0.25em 0.4em;">
            0
          </span>
        </a>
      </div>
    </div>
  </nav>

  <!-- SECCIÓN DEL CARRUSEL ULTRA COMPACTA (Estilos restrictivos integrados) -->
  <section class="my-4 d-flex justify-content-center">
    <!-- max-width: 400px restringe estrictamente el ancho horizontal en PC -->
    <div id="demo" class="carousel slide shadow rounded overflow-hidden bg-white" data-bs-ride="carousel" style="width: 100%; max-width: 600px;">
      
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="3"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="4"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="5"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="6"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="7"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="8"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="9"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="10"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="11"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="12"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="13"></button>
      </div>

      <!-- height: 200px restringe estrictamente la altura vertical -->
      <div class="carousel-inner" style="height: 300px;">
        <!-- object-fit: contain evita que el escudo se deforme o se corte -->
        <div class="carousel-item active"><img src="Escudos/aguilas.jpg" alt="Aguilas" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/america.png" alt="America" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/bucaramanga.png" alt="Bucaramanga" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/cali.png" alt="Cali" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/chico.png" alt="Chico" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/cucuta.png" alt="Cucuta" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/huila.jpg" alt="Huila" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/junior.png" alt="Junior" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/medellin.jpg" alt="Medellin" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/millos.jpg" alt="Millonarios" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/nacional.png" alt="Nacional" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/oncecaldas.jpg" alt="Once Caldas" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/Santafe.jpg" alt="Santa Fe" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
        <div class="carousel-item"><img src="Escudos/tolima.jpg" alt="Tolima" class="d-block w-100" style="height: 300px; object-fit: contain; padding: 15px;"></div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-dark rounded-circle p-2"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-dark rounded-circle p-2"></span>
      </button>
    </div>
  </section>

  <!-- EL DIV DEL OFFCANVAS -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoOffcanvasLabel">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold" id="carritoOffcanvasLabel">Mi Carrito</h5>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <div class="carrito-productos overflow-auto mb-3" style="max-height: 60vh;">
        <div id="lista-carrito">
          <!-- Los productos se inyectarán aquí -->
        </div>
      </div>

      <div class="carrito-resumen border-top pt-3 bg-white mt-auto">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="fw-bold fs-5">Total:</span>
          <span class="fw-bold fs-5 text-primary" id="total-carrito">$ 0 COP</span>
        </div>
        <button class="btn btn-success w-100 py-2 fw-bold" id="btn-comprar">
          Proceder al Pago
        </button>
      </div>
    </div>
  </div>


  <!-- JavaScript de Bootstrap Oficial Corregido v5.3.3 -->
  <script src="https://jsdelivr.net"></script> 

</body>
</html>
